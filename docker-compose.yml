services:
  postgres:
    image: postgres:16-alpine
    container_name: crowdfunding-postgres
    environment:
      POSTGRES_DB: crowdfunding
      POSTGRES_USER: crowdfunding
      POSTGRES_PASSWORD: crowdfunding
    ports:
      - "5432:5432"
    volumes:
      - crowdfunding-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdfunding -d crowdfunding"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crowdfunding-pgdata:

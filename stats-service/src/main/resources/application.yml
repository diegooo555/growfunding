spring:
  application:
    name: stats-service
  datasource:
    # Own database: the read model never shares storage with the write side.
    url: jdbc:h2:file:./data/stats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: stats-service
      auto-offset-reset: earliest

server:
  port: 8082

stats:
  topic: crowdfunding.domain-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Every log line carries the service name and the correlation id of the originating request
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

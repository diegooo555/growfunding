spring:
  application:
    name: crowdfunding
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

crowdfunding:
  cors:
    # Origin patterns; the Angular dev server runs on http://localhost:4200 by default.
    allowed-origins: http://localhost:[*],http://127.0.0.1:[*]
  campaign:
    closing-soon-window: 24h
  contribution:
    max-attempts: 5
  scheduling:
    enabled: true
  scheduler:
    deadline-check-ms: 60000
    deadline-initial-delay-ms: 5000
  outbox:
    relay-delay-ms: 5000
    batch-size: 50
    max-attempts: 10
  events:
    kafka:
      # When enabled, the outbox relay also forwards every domain event to Kafka so other
      # services (stats-service) can react. Off by default so dev and tests need no broker.
      enabled: ${KAFKA_EVENTS_ENABLED:false}
      topic: crowdfunding.domain-events
  notifications:
    # Probability (0.0-1.0) that the logging channel fails, to demonstrate outbox retries.
    simulated-failure-rate: 0.0
  seed:
    enabled: true

logging:
  pattern:
    # Every log line carries the service name and the request correlation id
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    com.g7.crowdfunding: INFO

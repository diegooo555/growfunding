spring:
  application:
    name: crowdfunding
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

crowdfunding:
  cors:
    # Origin patterns; the Angular dev server runs on http://localhost:4200 by default.
    allowed-origins: http://localhost:[*],http://127.0.0.1:[*]
  campaign:
    closing-soon-window: 24h
  contribution:
    max-attempts: 5
  scheduling:
    enabled: true
  scheduler:
    deadline-check-ms: 60000
    deadline-initial-delay-ms: 5000
  outbox:
    relay-delay-ms: 5000
    batch-size: 50
    max-attempts: 10
  notifications:
    # Probability (0.0-1.0) that the logging channel fails, to demonstrate outbox retries.
    simulated-failure-rate: 0.0
  seed:
    enabled: true

logging:
  level:
    com.g7.crowdfunding: INFO
